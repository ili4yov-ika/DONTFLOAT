name: Release packages

# Пакеты под Linux и macOS собираются на своих раннерах и складываются в релиз.
#
# Схема как в разборе на Habr (habr.com/ru/articles/466501): по джобе на систему
# плюс отдельная джоба выгрузки с `needs`. Между джобами окружение не переживает,
# поэтому готовые файлы передаются через upload-artifact / download-artifact.
# Выгружает `gh release upload` из GITHUB_TOKEN — сторонний экшен для этого не
# нужен, и он один умеет класть файлы в **черновик** релиза.
#
# Windows-установщик здесь не собирается: `tools/build_windows_installer.bat`
# требует NSIS и локально установленный Qt. Его по-прежнему собирают локально.
#
# Плагин (VST3 с ARA) собирается и здесь: оба SDK открытые, поэтому джобы
# выкачивают их прямо на раннере. Клонируем поверхностно и вместе с
# подмодулями — без них SDK не конфигурируется.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, куда класть пакеты (например v0.1.0.0)'
        required: true
        type: string

# Тег берётся либо из события релиза, либо из поля запуска вручную
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  linux:
    name: Linux (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            rpm \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      # Оба SDK открытые; поверхностный клон с подмодулями — иначе VST3 SDK
      # не конфигурируется, а ARA не находит своих заголовков
      - name: Fetch VST3 and ARA SDKs
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/Celemony/ARA_SDK.git "$RUNNER_TEMP/ARA_SDK"

      # Приложение и плагин VST3 с ARA. CLAP и LV2 выключены совсем (см. README):
      # держать их в рабочем состоянии дороже, чем они дают. Мини-DAW и
      # plugin_tester — инструменты разработчика, в пакет им не место.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDONTFLOAT_BUILD_PLUGINS=ON \
            -DDONTFLOAT_BUILD_CLAP=OFF \
            -DDONTFLOAT_BUILD_LV2=OFF \
            -DDONTFLOAT_BUILD_VST3=ON \
            -DDONTFLOAT_VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk" \
            -DDONTFLOAT_ARA_SDK_ROOT="$RUNNER_TEMP/ARA_SDK" \
            -DDONTFLOAT_BUILD_MINI_DAW=OFF \
            -DDONTFLOAT_BUILD_PLUGIN_TESTER=OFF

      - name: Build
        run: cmake --build build --parallel

      # Бандл VST3 обязан попасть в пакет: молча собрать приложение без
      # плагина — худший исход, поэтому шаг падает, если бандла нет
      - name: Check the VST3 bundle is installed
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/checkroot" > /dev/null
          found=$(find "$RUNNER_TEMP/checkroot/lib/vst3" -name '*.so' | sort)
          echo "$found"
          test -n "$found" || { echo '::error::Бандл VST3 не установился'; exit 1; }

      # Все три генератора, что объявлены в CPack для Linux: пакеты для
      # dpkg и rpm плюс переносимый архив для всего остального
      - name: Package (.deb, .rpm, .tar.gz)
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G RPM
          cpack -G TGZ
          ls -la ./*.deb ./*.rpm ./*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (.pkg, .dmg)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      # Пресет macos-release собирается Ninja — на раннере его нет
      - name: Install Ninja
        run: brew install ninja

      - name: Fetch VST3 and ARA SDKs
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/Celemony/ARA_SDK.git "$RUNNER_TEMP/ARA_SDK"

      # Тот же скрипт, которым собирают локально:
      # сборка → macdeployqt → pkgbuild (.pkg) и hdiutil (.dmg)
      #
      # SDK передаются через окружение (их читает CMakeLists), поэтому плагин
      # здесь **собирается**, но в .pkg и .dmg пока не кладётся: бандлу нужен
      # свой развёрнутый Qt, а проверить это без настоящего Mac негде.
      # Сборка при этом ловит ошибки компиляции под macOS — ради этого шаг и
      # держит SDK.
      - name: Build and package (.pkg, .dmg)
        run: bash tools/macos_build.sh release pkg dmg
        env:
          CMAKE_PREFIX_PATH: ${{ steps.qt.outputs.QT_ROOT_DIR }}
          DONTFLOAT_VST3_SDK_ROOT: ${{ runner.temp }}/vst3sdk
          DONTFLOAT_ARA_SDK_ROOT: ${{ runner.temp }}/ARA_SDK

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/macos/*.pkg
            build/macos/*.dmg
          if-no-files-found: error

  upload:
    name: Attach packages to the release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: List packages
        run: find packages -type f -exec ls -la {} +

      # --clobber перезаписывает файл с тем же именем: повторный запуск обновляет
      # пакеты в релизе, а не падает на «asset already exists»
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Не задан тег релиза"
            exit 1
          fi
          mapfile -t files < <(find packages -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.pkg' -o -name '*.dmg' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Пакеты не найдены"
            exit 1
          fi
          printf 'Кладу в релиз %s:\n' "$RELEASE_TAG"
          printf '  %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
